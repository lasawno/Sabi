name: Character review
on:
  workflow_dispatch:
  push:
    paths:
      - 'character/build_sabi.py'
      - '.github/workflows/character-review.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxrender1 libxkbcommon0 libsm6 libgl1 ffmpeg
      - name: Download Blender 4.5.0
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Build editable character
        run: /tmp/blender-4.5.0-linux-x64/blender -b --factory-startup --python-exit-code 1 --python character/build_sabi.py
      - name: Render first review frame
        run: /tmp/blender-4.5.0-linux-x64/blender -b character/output/Sabi-Character-Blockout.blend -o //review_ -f 1
      - name: Render motion review
        run: |
          /tmp/blender-4.5.0-linux-x64/blender -b character/output/Sabi-Character-Blockout.blend --python-expr "import bpy; s=bpy.context.scene; s.cycles.samples=8; s.render.resolution_percentage=50; s.frame_step=3" -o //motion_ -a
          ffmpeg -y -framerate 10 -pattern_type glob -i 'character/output/motion_*.png' -c:v libx264 -pix_fmt yuv420p -movflags +faststart character/output/Sabi-Motion-Review.mp4
          rm character/output/motion_*.png
      - uses: actions/upload-artifact@v4
        with:
          name: sabi-character-review
          path: character/output/
          retention-days: 7
